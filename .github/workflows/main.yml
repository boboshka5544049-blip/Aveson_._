name: Build AVESON APK V5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract AVESON project
        run: |
          if find . -maxdepth 3 -name "settings.gradle" | grep -q .; then
            echo "Project already exists"
          else
            ZIP=$(find . -type f -iname "*.zip" | head -n 1)
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted

            FOUND=$(find extracted -name "settings.gradle" -print -quit)
            PROJECT_DIR=$(dirname "$FOUND")

            cp -r "$PROJECT_DIR"/. .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build AVESON APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload AVESON APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-APK-V5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
